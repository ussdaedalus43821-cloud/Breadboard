<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breadboard</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #2b2d31;
        color: #e8e8e8;
      }
      main {
        padding: 16px;
      }
      #palette {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      #palette button,
      #sim-controls button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid #4a4d55;
        border-radius: 6px;
        background: #383a40;
        color: inherit;
        cursor: pointer;
      }
      #palette button[aria-pressed='true'] {
        background: #ff9f1c;
        border-color: #ff9f1c;
        color: #1b1b1b;
      }
      #sim-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
      }
      #clock {
        font-family: ui-monospace, monospace;
        min-width: 11ch;
        padding: 0 6px;
      }
      #board {
        display: block;
        touch-action: none;
      }
      #status,
      #hover {
        margin-top: 8px;
        font-family: ui-monospace, monospace;
      }
      #hover {
        color: #9aa0a6;
        min-height: 1.2em;
      }
      #scripting-toggle {
        margin-top: 12px;
      }
      #scripting-toggle,
      #scripting button,
      #scripting select,
      #scripting input {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid #4a4d55;
        border-radius: 6px;
        background: #383a40;
        color: inherit;
      }
      #scripting {
        margin-top: 8px;
        max-width: 900px;
      }
      .script-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
      }
      #script-timeout {
        width: 7ch;
      }
      #script-source,
      #script-output {
        box-sizing: border-box;
        width: 100%;
        font:
          13px/1.45 ui-monospace,
          monospace;
        background: #1e1f22;
        color: #e8e8e8;
        border: 1px solid #4a4d55;
        border-radius: 6px;
        padding: 8px;
      }
      #script-source {
        height: 260px;
        resize: vertical;
      }
      #script-output {
        min-height: 60px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
      }
      #script-output .stderr {
        color: #ff8787;
      }
      #script-status {
        margin: 6px 0;
        font-family: ui-monospace, monospace;
        color: #9aa0a6;
      }
      #script-status[data-tone='ok'] {
        color: #8ce99a;
      }
      #script-status[data-tone='error'] {
        color: #ff8787;
      }
      #warnings {
        margin: 8px 0 0;
        padding-left: 20px;
        color: #fab005;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="palette" role="toolbar" aria-label="Parts">
        <button type="button" data-tool="select" aria-pressed="true">Select</button>
        <button type="button" data-tool="part" data-type="led-red" aria-pressed="false">LED</button>
        <button type="button" data-tool="part" data-type="resistor-100" aria-pressed="false">
          100 Ω
        </button>
        <button type="button" data-tool="part" data-type="resistor" aria-pressed="false">
          330 Ω
        </button>
        <button type="button" data-tool="part" data-type="resistor-1k" aria-pressed="false">
          1 kΩ
        </button>
        <button type="button" data-tool="part" data-type="resistor-10k" aria-pressed="false">
          10 kΩ
        </button>
        <button type="button" data-tool="part" data-type="switch-spst" aria-pressed="false">
          SPST switch
        </button>
        <button type="button" data-tool="wire" aria-pressed="false">Wire</button>
        <button type="button" data-tool="supply" data-supply="power" aria-pressed="false">
          +5V lead
        </button>
        <button type="button" data-tool="supply" data-supply="ground" aria-pressed="false">
          GND lead
        </button>
        <button type="button" data-tool="part" data-type="chip74hc00" aria-pressed="false">
          74HC00
        </button>
        <button type="button" data-tool="part" data-type="chip74hc02" aria-pressed="false">
          74HC02
        </button>
        <button type="button" data-tool="part" data-type="chip74hc04" aria-pressed="false">
          74HC04
        </button>
        <button type="button" data-tool="part" data-type="chip74hc08" aria-pressed="false">
          74HC08
        </button>
      </div>
      <div id="sim-controls" role="toolbar" aria-label="Simulation">
        <button type="button" id="run-toggle">Pause</button>
        <button type="button" id="step-1">Step 1 ms</button>
        <span id="clock">t = 0 ms</span>
        <button type="button" id="load-demo">Load half-adder demo</button>
        <button type="button" id="clear-board">Clear board</button>
      </div>
      <canvas id="board"></canvas>
      <button
        type="button"
        id="scripting-toggle"
        aria-expanded="false"
        aria-controls="scripting"
        disabled
      >
        Scripting (NovaLang)
      </button>
      <section id="scripting" hidden aria-label="NovaLang scripting">
        <div class="script-bar">
          <label
            >Example
            <select id="script-example"></select
          ></label>
          <button type="button" id="script-run">Run script</button>
          <button type="button" id="script-stop" disabled>Stop</button>
          <label>Timeout <input id="script-timeout" type="number" min="100" step="100" /> ms</label>
        </div>
        <textarea id="script-source" spellcheck="false" aria-label="Script source"></textarea>
        <div id="script-status" role="status"></div>
        <div id="script-output" aria-label="Script output"></div>
      </section>
      <div id="status"></div>
      <div id="hover"></div>
      <ul id="warnings" aria-label="Warnings"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
