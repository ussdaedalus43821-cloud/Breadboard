<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breadboard</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #2b2d31;
        color: #e8e8e8;
      }
      main {
        padding: 16px;
      }
      #palette {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      #palette button,
      #sim-controls button {
        font: inherit;
        padding: 6px 12px;
        border: 1px solid #4a4d55;
        border-radius: 6px;
        background: #383a40;
        color: inherit;
        cursor: pointer;
      }
      #palette button[aria-pressed='true'] {
        background: #ff9f1c;
        border-color: #ff9f1c;
        color: #1b1b1b;
      }
      #sim-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
      }
      #clock {
        font-family: ui-monospace, monospace;
        min-width: 11ch;
        padding: 0 6px;
      }
      #board {
        display: block;
        touch-action: none;
      }
      #status,
      #hover {
        margin-top: 8px;
        font-family: ui-monospace, monospace;
      }
      #hover {
        color: #9aa0a6;
        min-height: 1.2em;
      }
      #warnings {
        margin: 8px 0 0;
        padding-left: 20px;
        color: #fab005;
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="palette" role="toolbar" aria-label="Parts">
        <button type="button" data-tool="select" aria-pressed="true">Select</button>
        <button type="button" data-tool="part" data-type="led-red" aria-pressed="false">LED</button>
        <button type="button" data-tool="part" data-type="resistor" aria-pressed="false">
          Resistor
        </button>
        <button type="button" data-tool="part" data-type="switch-spst" aria-pressed="false">
          SPST switch
        </button>
        <button type="button" data-tool="wire" aria-pressed="false">Wire</button>
        <button type="button" data-tool="supply" data-supply="power" aria-pressed="false">
          +5V lead
        </button>
        <button type="button" data-tool="supply" data-supply="ground" aria-pressed="false">
          GND lead
        </button>
        <button type="button" data-tool="part" data-type="chip74hc00" aria-pressed="false">
          74HC00
        </button>
        <button type="button" data-tool="part" data-type="chip74hc02" aria-pressed="false">
          74HC02
        </button>
        <button type="button" data-tool="part" data-type="chip74hc04" aria-pressed="false">
          74HC04
        </button>
        <button type="button" data-tool="part" data-type="chip74hc08" aria-pressed="false">
          74HC08
        </button>
      </div>
      <div id="sim-controls" role="toolbar" aria-label="Simulation">
        <button type="button" id="run-toggle">Pause</button>
        <button type="button" id="step-1">Step 1 ms</button>
        <span id="clock">t = 0 ms</span>
        <button type="button" id="load-demo">Load half-adder demo</button>
        <button type="button" id="clear-board">Clear board</button>
      </div>
      <canvas id="board"></canvas>
      <div id="status"></div>
      <div id="hover"></div>
      <ul id="warnings" aria-label="Warnings"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
